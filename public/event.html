<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dosya — Antik Göklerin Sırları</title>
<meta name="description" content="Belgelenmiş gizem dosyası — Antik Göklerin Sırları arşivi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>

<header class="nav">
  <div class="container nav-inner">
    <a class="nav-logo" href="/"><span class="star">✦</span> Antik Göklerin Sırları</a>
    <button class="nav-toggle" aria-label="Menüyü aç/kapat" aria-expanded="false" aria-controls="nav-menu"><span></span></button>
    <ul class="nav-links" id="nav-menu">
      <li><a href="/#arsiv">Arşiv</a></li>
      <li><a href="/#zaman-tuneli">Zaman Tüneli</a></li>
      <li><a href="/#topluluk">Gözlem Bildirimleri</a></li>
      <li><a href="/#iletisim">İletişim</a></li>
      <li><a href="/#gozlem-bildir" class="nav-cta">Gözlem Bildir</a></li>
    </ul>
  </div>
</header>

<main id="detail-root">
  <section class="detail-hero">
    <div class="bg"></div>
    <div class="container">
      <p class="crumb"><a href="/#arsiv">← Arşive Dön</a></p>
      <span class="badge badge-yellow" id="d-status" hidden></span>
      <h1 id="d-title">Dosya yükleniyor…</h1>
      <div class="sub">
        <span id="d-location" hidden></span>
        <span id="d-date" hidden></span>
        <span id="d-coords" hidden></span>
        <span id="d-views" hidden></span>
      </div>
    </div>
  </section>

  <div class="container detail-layout">
    <article class="detail-body" id="d-body"></article>
    <aside>
      <div class="fact-box" id="d-facts" hidden>
        <h3>Dosya Künyesi</h3>
        <div id="d-facts-list"></div>
      </div>
    </aside>
  </div>

  <section class="section section-alt related" id="d-related-wrap" hidden>
    <div class="container">
      <h2>İlgili Dosyalar</h2>
      <div class="cards" id="d-related"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom" style="border-top:0;padding-top:0;">
      <span>© <span id="year"></span> Antik Göklerin Sırları — Belgesel amaçlıdır.</span>
      <span><a href="/#arsiv">Arşive Dön</a></span>
    </div>
  </div>
</footer>

<script src="/js/main.js" defer></script>
<script src="/js/event.js" defer></script>
</body>
</html>
